<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funda Watch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="wordmark">funda watch</span><span class="unofficial">unofficial</span></div>
  <div id="summary" class="summary" aria-live="polite">Loading…</div>
  <div class="topbar-actions">
    <button class="btn white" id="markSeen" type="button" title="Clear the NEW badges">Mark all seen</button>
    <details class="menu" id="menu">
      <summary class="btn white icon" aria-label="More options" title="More">⋯</summary>
      <div class="menu-panel">
        <button type="button" id="exportBtn">Export statuses</button>
        <button type="button" id="importBtn">Import statuses</button>
        <label><input type="checkbox" id="photosToggle"> Photos in the list</label>
        <label><input type="checkbox" id="supermarketsToggle"> Supermarkets on the map</label>
        <button type="button" id="resetBtn">Reset all filters</button>
        <div class="hint">Keys: <b>j</b>/<b>k</b> move, <b>i</b> interested, <b>v</b> viewing, <b>s</b> skip, <b>Enter</b> details, <b>c</b> compare</div>
      </div>
    </details>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Listings"></nav>

<section class="toolbar" aria-label="Search and sort">
  <div class="search">
    <label class="sr" for="q">Search street, wijk or buurt</label>
    <input id="q" type="search" placeholder="Street, wijk, buurt" autocomplete="off">
  </div>
  <button class="btn primary" id="filtersBtn" type="button">Filters <span class="count" id="filtersCount" hidden></span></button>
  <button class="btn" id="newBtn" type="button" aria-pressed="false">New <span class="count" id="newCount">0</span></button>
  <button class="btn" id="dropsBtn" type="button" aria-pressed="false">Price drops <span class="count" id="dropsCount">0</span></button>
  <span class="spacer"></span>
  <label class="sr" for="sort">Sort by</label>
  <select id="sort" class="sel">
    <option value="score">Best score</option>
    <option value="published">Newest on Funda</option>
    <option value="new">Newest here</option>
    <option value="price">Price, low to high</option>
    <option value="ppm2">€/m², low to high</option>
    <option value="balcony">Biggest balcony</option>
    <option value="drop">Biggest price drop</option>
  </select>
  <label class="sr" for="group">Group by</label>
  <select id="group" class="sel">
    <option value="none">No grouping</option>
    <option value="wijk">Group by wijk</option>
    <option value="city">Group by city</option>
    <option value="tier">Group by tier</option>
    <option value="status">Group by status</option>
  </select>
  <div class="seg" role="group" aria-label="Density">
    <button type="button" id="densityDetailed" aria-pressed="true">Detailed</button>
    <button type="button" id="densityCompact" aria-pressed="false">Compact</button>
  </div>
  <button class="btn view-toggle" id="viewToggle" type="button">Map</button>
</section>
<div class="active-filters" id="activeFilters"></div>

<main class="split" id="split" data-view="list">
  <div id="list"></div>
  <aside class="mapwrap">
    <div id="map" role="region" aria-label="Map of listings"></div>
    <p id="mapnote"></p>
  </aside>
</main>

<div class="comparebar" id="compareBar" hidden>
  <span id="compareText"></span>
  <button class="btn" id="compareClear" type="button">Clear</button>
  <button class="btn primary" id="compareOpen" type="button">Compare</button>
</div>

<dialog id="filterDialog" aria-labelledby="filterTitle">
  <div class="dlg-head"><h2 id="filterTitle">Filters</h2><button class="btn small" type="button" id="filterClose" aria-label="Close">✕</button></div>
  <div class="dlg-body" id="filterBody"></div>
  <div class="dlg-foot"><button class="btn" type="button" id="filterReset">Reset</button><button class="btn primary" type="button" id="filterShow">Show results</button></div>
</dialog>

<dialog id="compareDialog" aria-labelledby="compareTitle">
  <div class="dlg-head"><h2 id="compareTitle">Compare</h2><button class="btn small" type="button" id="compareClose" aria-label="Close">✕</button></div>
  <div class="dlg-body" id="compareBody"></div>
</dialog>

<footer>Funda Watch is an unofficial personal tool and is not affiliated with funda. Listing data © the listing agents via funda.nl. Map © OpenStreetMap contributors.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
