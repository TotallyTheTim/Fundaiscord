name: Funda Watch

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts to the log instead of sending them (state is not saved)"
        type: boolean
        default: false
      full_sweep:
        description: "Read every result page now, not just the newest (finds old listings that changed)"
        type: boolean
        default: false

permissions:
  contents: write # commits data/seen-listings.json back

# Two overlapping runs would both alert on the same listing and race on the state push.
concurrency:
  group: funda-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Funda
        run: python src/main.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.full_sweep && '--full' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

      # always(): if one search failed, the alerts that did go out must still be recorded.
      - name: Save state
        if: always() && !inputs.dry_run
        run: |
          git config user.name "funda-watch"
          git config user.email "funda-watch@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update listing state"
          git push || (git pull --rebase && git push)
