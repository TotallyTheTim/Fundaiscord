# Which houses trigger a Discord alert. Edit and commit; no code changes needed.

startup:
  # The very first run records every listing that matches today. Older ones are marked
  # as seen without an alert (there could be hundreds); the rest depends on this:
  #   true  = alert for matches published within `old_listing_after_days`
  #   false = record everything silently, alert from the second run onwards
  notify_existing: true

notifications:
  # A match we haven't seen before that was published longer ago than this must have
  # changed (price drop, new label, ...), so it gets the red "OLD LISTING" alert.
  old_listing_after_days: 3

sweep:
  # Runs (every 30 min) normally read only the newest result pages. Every this many hours
  # one run reads all pages, which is what finds old listings that changed.
  full_every_hours: 12

filters:
  max_price: 401000        # EUR, inclusive
  min_surface: 75          # m², living area
  min_bedrooms: 2

  # A listing with a missing field still alerts, flagged "⚠️ ... unknown".
  energy_labels:
    always: [A++++, A+++, A++, A+, A, B, C, D]
    only_below_price:      # accepted only when the price is strictly below this
      E: 300000
    # F and G are never accepted

# `location` is Funda's slug. `wijken` keeps only listings whose buurt belongs to one of
# these wijken (see data/buurt-wijk.json). Funda can filter by buurt but not by wijk, so
# each wijk is sent to Funda as the list of its buurten, which means fewer pages to read. Wijken were ranked 2/3 Leefbaarometer 2024 +
# 1/3 registered crime per 1,000 residents (CBS/Politie, Sep 2025 – Aug 2026).
searches:
  - name: Den Haag
    location: den-haag
    wijken:
      - Duinoord
      - Archipelbuurt
      - Geuzen- en Statenkwartier
      - Benoordenhout
      - Vogelwijk
      - Willemspark
      - Westbroekpark en Duttendel
      - Bomen- en Bloemenbuurt
      - Belgisch Park
      - Vruchtenbuurt
      - Kijkduin en Ockenburgh
      - Zeeheldenkwartier
      - Bohemen en Meer en Bos
      - Scheveningen
      - Kraayenstein en Vroondaal
      - Duindorp
      - Ypenburg
      - Leidschenveen
      - Valkenboskwartier
      - Regentessekwartier
      - Wateringse Veld
      - Bezuidenhout
      - Waldeck
      - Mariahoeve en Marlot
      - Loosduinen
      - Leyenburg
      - Groente- en Fruitmarkt
      - Rustenburg en Oostbroek

  - name: Rijswijk
    location: rijswijk-zh
    wijken:            # CBS only numbers these wijken
      - Wijk 01        # Cromvliet, Leeuwendaal
      - Wijk 10        # Sion, Elsenburg, Pasgeld, Haantje
      - Wijk 02        # Oud-Rijswijk, Bomenbuurt, Welgelegen, Rembrandtkwartier, Havenkwartier
      - Wijk 08        # Overvoorde, Strijp, Presidentenbuurt, Ministerbuurt

  - name: Delft
    location: delft
    wijken:
      - Hof van Delft
      - Voordijkshoorn
      - Vrijenban
      - Binnenstad
      - Tanthof-West
      - Tanthof-Oost

# How alerts are ranked. Every new listing starts at `base`; each fact adds or removes
# points (all optional, these are the defaults). The score picks the tier, which sets the
# alert's colour and headline. Alerts arrive worst first so the best one is the last message.
scoring:
  base: 50
  vve_expensive_per_m2: 2.5      # EUR/m² per month above which a VvE fee starts counting as expensive
  vve_expensive_cap: -15         # the VvE-cost penalty never goes past this
  supermarket_penalty_cap: -10   # the supermarket-distance penalty never goes past this
  price_per_m2_reference: 4157   # "normal" EUR/m² (today's real market median); cheaper = bonus, pricier = penalty
  price_per_m2_cap: 12           # the price/m² bonus and penalty are both capped at this many points
  tiers:                         # minimum score per tier; below `ok` is "low"
    top: 70
    good: 55
    ok: 40
  weights:
    erfpacht: -45                # also forces the "low" tier, unless perpetually bought off
    erfpacht_perpetual: -25
    balcony_at_2_m2: 3           # points rise from 2 m² to 8 m², then flatten out by 12 m²
    balcony_at_8_m2: 12
    balcony_at_12_m2: 15
    balcony_unknown_size: 6
    garden: 3
    house: 4
    first_floor: 3
    top_floor: 3                 # guessed from the description ("top etage", "penthouse", ...)
    bedrooms_3_plus: 8           # room for an office
    needs_work: -20              # description says kluswoning / op te knappen / te renoveren
    move_in_ready: 8             # description says instapklaar / gerenoveerd / nieuwe keuken
    built_before_1940: 4         # character
    monument: 2
    vve_no_reserve_fund: -10
    vve_no_maintenance_plan: -6
    vve_not_registered: -6
    vve_expensive_per_m2_rate: -4      # points per EUR/m²/month above vve_expensive_per_m2; a lift halves this rate (not waives it)
    busy_road: -2
    label_step_up: 5                   # per step better than "C" (B=+5, A=+10, A+=+15, ...)
    label_step_down: 6                 # magnitude per step worse than "C" (D=-6, E=-12, ...)
    supermarket_penalty_per_100m: -1   # -1 for every full 100 m to the nearest supermarket (docs/supermarkets.json); no bonus for being close
    price_per_m2_rate: 0.02            # points per EUR/m² below (bonus) or above (penalty) price_per_m2_reference
